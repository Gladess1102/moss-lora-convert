name: Bug report
description: Something is broken or behaves differently than documented
labels: [bug]
body:
  - type: checkboxes
    id: searched
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and the README
          required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and hardware
      placeholder: e.g. macOS 27.2, Apple M1, 16 GB
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release tag or commit, plus the version of the tool this repo plugs into if any.
      placeholder: e.g. v0.1.1 (git describe --tags)
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Configuration
      description: Preset, mode, flags, or the command you ran.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output or the last lines of the log.
      render: shell
  - type: textarea
    id: tried
    attributes:
      label: What you already tried
